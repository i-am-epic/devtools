<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Export tool manifest</title>
<style>
  body { font-family: ui-monospace, Consolas, monospace; padding: 1.5rem; background: #14140f; color: #ede9e0; font-size: 13px; }
  .pass { color: #4ade80; } .fail { color: #f87171; }
  pre { white-space: pre-wrap; line-height: 1.55; }
</style>
</head>
<body>
<h1 style="font-size:1.1rem">Export tool manifest</h1>
<p style="color:#93c5fd">Python cannot execute the JS registry, so the catalogue is exported
from the browser for the SEO build script. Needs the server started with
DEVTOOLS_TEST_ENDPOINTS=1.</p>
<pre id="out">exporting...</pre>
<script type="module">
const out = document.getElementById('out');
const esc = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

for (const u of ['../js/tools/registry.js', '../js/tools/AgentTool.js']) {
  await fetch(u, { cache: 'reload' }).catch(() => {});
}

try {
  const { TOOLS, CATEGORIES } = await import('../js/tools/registry.js');
  const { loadAgentTools } = await import('../js/tools/AgentTool.js');
  const agents = await loadAgentTools();

  const all = [...TOOLS, ...agents];

  const manifest = {
    generatedAt: new Date().toISOString(),
    categories: CATEGORIES,
    tools: all.map((tool) => ({
      id: tool.id,
      name: tool.name,
      description: tool.description,
      category: tool.category,
      icon: typeof tool.icon === 'string' ? tool.icon : '',
      keywords: tool.keywords || [],
      // Spec detail gives the landing pages real content to work with.
      lede: tool.spec?.lede || '',
      footnote: tool.spec?.footnote || '',
      inputLabel: tool.spec?.input?.label || '',
      outputLabel: tool.spec?.output?.label || '',
      sample: tool.spec?.input?.sample || '',
      options: (tool.spec?.options || []).map((o) => ({
        id: o.id, label: o.label, type: o.type, hint: o.hint || '',
        choices: (o.choices || []).map((c) => (typeof c === 'string' ? c : c.label)),
      })),
      isAgent: tool.category === 'agents',
      bespoke: Boolean(tool.toolClass),
    })),
  };

  const response = await fetch('/api/dev/manifest', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(manifest),
  });
  const result = await response.json();

  if (result.ok) {
    out.innerHTML = `<span class="pass">Wrote tools-manifest.json with ${result.written} tools.</span>\n\n`
      + `Now run:\n  python scripts/build_seo.py\n\n`
      + `Categories: ${Object.keys(manifest.categories).length}\n`
      + `Tools: ${manifest.tools.length} (${manifest.tools.filter(t => t.isAgent).length} agents)`;
  } else {
    out.innerHTML = `<span class="fail">Server refused: ${esc(result.error)}</span>\n\n`
      + 'Start the server with DEVTOOLS_TEST_ENDPOINTS=1 and reload.';
  }
  window.__done = true;
  window.__count = result.written || 0;
} catch (err) {
  out.innerHTML = `<span class="fail">${esc(err.message)}\n${esc(err.stack)}</span>`;
  window.__done = true;
}
</script>
</body>
</html>
