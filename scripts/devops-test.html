<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DevOps tool correctness</title>
<style>
  body { font-family: ui-monospace, Consolas, monospace; padding: 1.5rem; background: #14140f; color: #ede9e0; font-size: 13px; }
  .pass { color: #4ade80; } .fail { color: #f87171; } .info { color: #93c5fd; }
  pre { white-space: pre-wrap; line-height: 1.55; }
</style>
</head>
<body>
<h1 style="font-size:1.1rem">DevOps, diagram and sanitiser checks</h1>
<pre id="out">running...</pre>
<script type="module">
const esc = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const out = document.getElementById('out');
const lines = [];
let pass = 0, fail = 0;
const check = (label, cond, detail = '') => {
  if (cond) { pass++; lines.push(`<span class="pass">ok   ${esc(label)}</span>`); }
  else { fail++; lines.push(`<span class="fail">FAIL ${esc(label)} ${esc(detail)}</span>`); }
};

for (const u of ['../js/tools/specs/devops.js','../js/tools/specs/diagram.js','../js/lib/sanitize.js',
                 '../js/tools/specs/security.js','../js/lib/hashes.js','../js/lib/bytes.js',
                 '../js/tools/registry.js','../js/tools/MarkdownViewerTool.js']) {
  await fetch(u, { cache: 'reload' }).catch(() => {});
}

try {
  const { TOOLS } = await import('../js/tools/registry.js');
  const spec = (id) => { const t = TOOLS.find(x => x.id === id); if (!t) throw new Error(`${id} missing`); return t.spec; };
  const defaults = (s, over = {}) => {
    const o = {};
    for (const opt of s.options || []) {
      o[opt.id] = opt.default !== undefined ? opt.default
        : opt.type === 'checkbox' ? false
        : opt.type === 'select' ? (typeof opt.choices[0] === 'string' ? opt.choices[0] : opt.choices[0].value)
        : opt.type === 'number' ? 0 : '';
    }
    return { ...o, ...over };
  };
  const run = async (id, input, over = {}) => {
    const s = spec(id);
    const r = await s.run({ input, options: defaults(s, over), bytes: null, fileName: '', tool: { id_: n => n } });
    return typeof r === 'string' ? { output: r } : r;
  };
  const hasRule = (r, rule) => r.output.includes(rule);

  // ------------------------------------------------------ YAML beautifier --
  lines.push('<b>YAML beautifier</b>');
  {
    const r = await run('yaml-formatter', 'a:   1\nb:\n    - x\n    - y\n');
    check('normalises indentation', r.output.includes('a: 1') && r.output.includes('  - x'), JSON.stringify(r.output));

    const sorted = await run('yaml-formatter', 'b: 2\na: 1\n', { sortKeys: true });
    check('sorts keys when asked', sorted.output.indexOf('a:') < sorted.output.indexOf('b:'), sorted.output);

    const multi = await run('yaml-formatter', 'a: 1\n---\nb: 2\n');
    check('handles multi-document', multi.note.includes('2 documents'), multi.note);

    const norway = await run('yaml-formatter', 'country: NO\nenabled: yes\n');
    check('warns about the Norway problem', norway.extraHtml.includes('Norway'), norway.extraHtml.slice(0, 80));

    let rejected = false;
    try { await run('yaml-formatter', 'a: [1, 2\nb: :\n'); } catch { rejected = true; }
    check('rejects invalid YAML', rejected);

    // round-trip equivalence: formatting must not change the data
    const src = 'name: svc\nlist:\n  - 1\n  - two\nnested: {a: 1, b: "x"}\n';
    const yaml = await (await import('../js/lib/loader.js')).libs.yaml();
    const formatted = (await run('yaml-formatter', src)).output;
    check('round-trips to identical data',
      JSON.stringify(yaml.load(formatted)) === JSON.stringify(yaml.load(src)),
      `${JSON.stringify(yaml.load(formatted))} vs ${JSON.stringify(yaml.load(src))}`);
  }

  // -------------------------------------------------- Dockerfile linter ----
  lines.push('\n<b>Dockerfile linter</b>');
  {
    const bad = `FROM node:latest
WORKDIR /app
COPY . .
RUN npm install
RUN apt-get update
RUN apt-get install -y curl
ENV API_KEY=sk-supersecret
CMD npm start`;
    const r = await run('dockerfile-linter', bad);
    check('flags unpinned base image', hasRule(r, 'pin-base-image'));
    check('flags COPY . . before install (cache bust)', hasRule(r, 'layer-order'));
    check('flags apt-get install split from update', hasRule(r, 'apt-update-separate'));
    check('flags secret baked into the image', hasRule(r, 'secret-in-image'));
    check('flags missing USER', hasRule(r, 'run-as-non-root'));
    check('flags shell-form CMD', hasRule(r, 'exec-form'));

    const good = `FROM node:20.11.1-alpine@sha256:abc
WORKDIR /app
COPY package*.json ./
RUN npm ci
COPY . .
USER node
HEALTHCHECK CMD node healthcheck.js
CMD ["node", "server.js"]`;
    const r2 = await run('dockerfile-linter', good);
    check('clean Dockerfile has no layer-order error', !hasRule(r2, 'layer-order'), r2.output);
    check('clean Dockerfile has no root warning', !hasRule(r2, 'run-as-non-root'));
    check('clean Dockerfile has no pin warning', !hasRule(r2, 'pin-base-image'));
    check('clean Dockerfile has no exec-form warning', !hasRule(r2, 'exec-form'));

    let rejected = false;
    try { await run('dockerfile-linter', '# only a comment'); } catch { rejected = true; }
    check('rejects a file with no instructions', rejected);
  }

  // ------------------------------------------------- compose validator -----
  lines.push('\n<b>Docker Compose validator</b>');
  {
    const r = await run('compose-validator', `version: "3.8"
services:
  web:
    image: nginx:latest
    ports: ["8080:80"]
    depends_on: [api]
  api:
    build: .
    ports: ["8080:3000"]
    privileged: true
    volumes: ["/:/host"]
    environment:
      - DB_PASSWORD=hunter2
  worker:
    image: x:1
    depends_on: [queue]
`);
    check('detects duplicate host port', hasRule(r, 'port-clash'));
    check('detects missing dependency', hasRule(r, 'missing-dependency'));
    check('detects privileged', hasRule(r, 'privileged'));
    check('detects host root mount', hasRule(r, 'mount-root'));
    check('detects inline secret', hasRule(r, 'inline-secret'));
    check('notes obsolete version key', hasRule(r, 'version-obsolete'));
    check('counts three services', r.note.includes('3 services'), r.note);

    const clean = await run('compose-validator', `services:
  web:
    image: nginx:1.25.3
    restart: unless-stopped
    healthcheck: {test: ["CMD","true"]}
    deploy: {resources: {limits: {memory: 256M}}}
`);
    check('clean compose has no errors', !hasRule(clean, 'port-clash') && !hasRule(clean, 'privileged'), clean.output);

    let rejected = false;
    try { await run('compose-validator', 'name: not-a-compose-file'); } catch (e) { rejected = e.message.includes('services'); }
    check('rejects a file with no services block', rejected);
  }

  // ------------------------------------------------------ k8s validator ----
  lines.push('\n<b>Kubernetes checker</b>');
  {
    const r = await run('k8s-validator', `apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          image: myrepo/api:latest
          env:
            - name: DB_PASSWORD
              value: hunter2
`);
    check('flags latest tag', hasRule(r, 'pin-image'));
    check('flags missing resource limits', hasRule(r, 'resource-limits'));
    check('flags missing liveness probe', hasRule(r, 'liveness-probe'));
    check('flags missing readiness probe', hasRule(r, 'readiness-probe'));
    check('flags inline secret', hasRule(r, 'inline-secret'));
    check('flags single replica', hasRule(r, 'replicas'));
    check('flags runAsNonRoot missing', hasRule(r, 'run-as-non-root'));

    const multi = await run('k8s-validator', 'kind: ConfigMap\napiVersion: v1\nmetadata: {name: a}\n---\nkind: Service\napiVersion: v1\nmetadata: {name: b}\n');
    check('handles multi-document manifests', multi.note.includes('2 documents'), multi.note);

    const secret = await run('k8s-validator', 'apiVersion: v1\nkind: Secret\nmetadata: {name: s}\ndata: {a: Yg==}\n');
    check('warns about committing a Secret', hasRule(secret, 'secret-in-git'));
  }

  // ------------------------------------------------------ GHA validator ----
  lines.push('\n<b>GitHub Actions checker</b>');
  {
    const r = await run('gha-validator', `name: CI
on:
  pull_request_target:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: some/action@main
      - run: echo "\${{ github.event.pull_request.title }}"
        env:
          TOKEN: ghp_abcdefghijklmnopqrstuvwxyz12
`);
    check('flags pull_request_target', hasRule(r, 'pull-request-target'));
    check('flags action pinned to a branch', hasRule(r, 'unpinned-action'));
    check('flags script injection', hasRule(r, 'script-injection'));
    check('flags hardcoded token', hasRule(r, 'hardcoded-secret'));
    check('flags missing permissions', hasRule(r, 'permissions'));

    const clean = await run('gha-validator', `name: CI
"on": {push: {branches: [main]}}
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: npm ci
        env:
          TITLE: \${{ github.event.pull_request.title }}
`);
    check('clean workflow has no injection finding', !hasRule(clean, 'script-injection'),
      'env: interpolation is safe; only run: bodies are injectable');
    check('clean workflow has no permissions finding', !hasRule(clean, 'permissions'));
    check('clean workflow has no unpinned finding', !hasRule(clean, 'unpinned-action'), clean.output);
  }

  // ------------------------------------------------------- k8s secrets -----
  lines.push('\n<b>Kubernetes Secret decoder</b>');
  {
    const dec = await run('k8s-secret', 'apiVersion: v1\nkind: Secret\ndata:\n  DB_PASSWORD: aHVudGVyMg==\n  API_KEY: c2stbGl2ZQ==\n', { direction: 'decode' });
    check('decodes base64 values', dec.output.includes('hunter2') && dec.output.includes('sk-live'), dec.output);

    const enc = await run('k8s-secret', 'DB_PASSWORD=hunter2\n', { direction: 'encode', name: 'app' });
    check('encodes to a Secret manifest', enc.output.includes('kind: Secret') && enc.output.includes('aHVudGVyMg=='), enc.output);
    check('encode warns base64 is not encryption', enc.extraHtml.includes('not encryption'));

    const str = await run('k8s-secret', 'A=b\n', { direction: 'encode', stringData: true });
    check('stringData mode skips base64', str.output.includes('stringData:') && str.output.includes('"b"'), str.output);
  }

  // ------------------------------------------------------- gitignore -------
  lines.push('\n<b>.gitignore generator</b>');
  {
    const r = await run('gitignore-generator', '', { stacks: 'node,python', includeSecrets: true, includeEditors: true });
    check('includes node patterns', r.output.includes('node_modules/'));
    check('includes python patterns', r.output.includes('__pycache__/'));
    check('includes secret patterns', r.output.includes('.env') && r.output.includes('*.pem'));
    check('keeps .env.example', r.output.includes('!.env.example'));
    let rejected = false;
    try { await run('gitignore-generator', '', { stacks: 'cobol' }); } catch { rejected = true; }
    check('rejects unknown stack', rejected);
  }

  // ------------------------------------------------- mermaid generator -----
  lines.push('\n<b>Mermaid generator &amp; validator</b>');
  {
    const flow = await run('mermaid-generator', 'A -> B\nB -> C', { kind: 'flowchart', direction: 'LR', shape: 'box' });
    check('flowchart has direction', flow.output.startsWith('flowchart LR'), flow.output.split('\n')[0]);
    check('flowchart has edges', (flow.output.match(/-->/g) || []).length === 2, flow.output);

    const labelled = await run('mermaid-generator', 'A ->|yes| B', { kind: 'flowchart' });
    check('edge labels supported', labelled.output.includes('-->|yes|'), labelled.output);

    const seq = await run('mermaid-generator', 'Browser -> Server: request\nServer -> DB: query', { kind: 'sequence' });
    check('sequence diagram built', seq.output.startsWith('sequenceDiagram') && seq.output.includes('participant'), seq.output);

    const pie = await run('mermaid-generator', 'Chrome, 62.4\nSafari, 20.1', { kind: 'pie' });
    check('pie chart built', pie.output.includes('"Chrome" : 62.4'), pie.output);

    const mind = await run('mermaid-generator', 'Root\n  Child A\n  Child B', { kind: 'mindmap' });
    check('mindmap built', mind.output.startsWith('mindmap'), mind.output);

    // Every generated diagram must actually parse.
    const { libs } = await import('../js/lib/loader.js');
    const mermaid = await libs.mermaid();
    mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });
    for (const [name, diagram] of [['flowchart', flow.output], ['sequence', seq.output], ['pie', pie.output], ['labelled', labelled.output]]) {
      let ok = true; let why = '';
      try { await mermaid.parse(diagram); } catch (e) { ok = false; why = (e.message || '').split('\n')[0]; }
      check(`generated ${name} parses in mermaid`, ok, why);
    }

    const valid = await run('mermaid-validator', 'flowchart TD\n  A --> B');
    check('validator accepts valid diagram', valid.note === 'Valid', valid.output);
    const invalid = await run('mermaid-validator', 'flowchart TD\n  A --> [[[');
    check('validator rejects invalid diagram', invalid.note === 'Invalid', invalid.output.slice(0, 80));
  }

  // ---------------------------------------------------------- sanitiser ----
  lines.push('\n<b>HTML sanitiser</b>');
  {
    const { sanitizeHtml, slugify } = await import('../js/lib/sanitize.js');
    const strip = (h) => sanitizeHtml(h);

    // These payloads are assembled from fragments: a literal "<script" or "</"
    // inside this inline module would terminate the script element and the rest
    // of the file would be parsed as HTML.
    const S = '<' + 'scr' + 'ipt>';
    const SE = '<' + '/scr' + 'ipt>';
    const IFRAME = '<' + 'iframe src="evil">' + '<' + '/iframe>';
    const STYLE = '<' + 'style>body{display:none}' + '<' + '/style>';

    check('removes script tags', !strip(`<p>a</p>${S}alert(1)${SE}`).includes('scr' + 'ipt'));
    check('removes event handlers', !strip('<p onclick="alert(1)">x</p>').includes('onclick'));
    check('removes javascript: hrefs', !strip('<a href="javascript:alert(1)">x</a>').includes('javascript:'));
    check('removes iframes', !strip(IFRAME).includes('iframe'));
    check('removes style blocks', !strip(STYLE).includes('style'));
    check('removes onerror on img', !strip('<img src=x onerror=alert(1)>').includes('onerror'));
    check('keeps safe markup', strip('<p><strong>bold</strong> and <em>italic</em></p>').includes('<strong>bold</strong>'));
    check('keeps tables', strip('<table><tr><td>a</td></tr></table>').includes('<td>a</td>'));
    check('keeps http links', strip('<a href="https://x.dev">x</a>').includes('https://x.dev'));
    check('keeps relative links', strip('<a href="/docs">x</a>').includes('/docs'));
    check('keeps data: image src', strip('<img src="data:image/png;base64,iVBOR">').includes('data:image/png'));
    check('drops data: html src', !strip(`<img src="data:text/html,${S}">`).includes('data:text/html'));
    check('adds noopener to target=_blank', strip('<a href="https://x.dev" target="_blank">x</a>').includes('noopener'));
    check('keeps task-list checkboxes', strip('<input type="checkbox" checked>').includes('checkbox'));
    check('drops other inputs', !strip('<input type="password">').includes('input'));
    check('unwraps unknown tags but keeps text', strip('<marquee>hello</marquee>').includes('hello'));

    const taken = new Set();
    check('slugify basic', slugify('Hello World!', taken) === 'hello-world');
    check('slugify dedupes', slugify('Hello World!', taken) === 'hello-world-1');
    check('slugify handles empty', slugify('!!!', taken) === 'section');
  }

  // ---------------------------------------------------------- security ----
  lines.push('\n<b>Security tools</b>');
  {
    const { totpAt, analysePassword, parseHeaders } = await import('../js/tools/specs/security.js');
    const { utf8ToBytes, base32ToBytes } = await import('../js/lib/bytes.js');

    // RFC 6238 Appendix B reference vectors, secret "12345678901234567890".
    const seed = utf8ToBytes('12345678901234567890');
    const vectors = [[59, '94287082'], [1111111109, '07081804'], [1111111111, '14050471'],
                     [1234567890, '89005924'], [2000000000, '69279037']];
    for (const [time, expected] of vectors) {
      const code = await totpAt(seed, time, { digits: 8, period: 30, algorithm: 'sha1' });
      check(`TOTP RFC 6238 vector at T=${time}`, code === expected, `${code} vs ${expected}`);
    }
    const six = await totpAt(base32ToBytes('JBSWY3DPEHPK3PXP'), 0, { digits: 6, period: 30, algorithm: 'sha1' });
    check('TOTP honours the digit count', six.length === 6, six);
    const t0 = await totpAt(seed, 0, { digits: 6, period: 30, algorithm: 'sha1' });
    const t29 = await totpAt(seed, 29, { digits: 6, period: 30, algorithm: 'sha1' });
    const t30 = await totpAt(seed, 30, { digits: 6, period: 30, algorithm: 'sha1' });
    check('TOTP is stable within a period', t0 === t29);
    check('TOTP rolls at the period boundary', t0 !== t30);

    // Password analysis
    const weak = analysePassword('password');
    check('common password flagged', weak.findings.some(f => f.name === 'Known password'));
    check('common password scores near zero', weak.bits <= 10, String(weak.bits));

    const suffixed = analysePassword('password123');
    check('common word plus suffix flagged', suffixed.findings.some(f => f.name.includes('suffix')));

    const keyboard = analysePassword('qwertyuiop99');
    check('keyboard run flagged', keyboard.findings.some(f => f.name === 'Keyboard pattern'));

    const repeated = analysePassword('aaabbbccc111');
    check('repeated characters flagged', repeated.findings.some(f => f.name === 'Repeated characters'));

    const strong = analysePassword('correct-horse-battery-staple-7Q');
    check('long passphrase scores well', strong.bits > 100, String(strong.bits));
    check('strong password has no error findings', !strong.findings.some(f => f.level === 'error'));
    check('longer password scores higher', analysePassword('Tr0ub4dor&3xyzQ').bits > analysePassword('Tr0ub4d').bits);

    // Header parsing + analyser
    const parsed = parseHeaders('HTTP/2 200\nContent-Type: text/html\nX-Frame-Options: DENY\n');
    check('header parsing lowercases names', parsed['content-type'] === 'text/html');
    check('status line ignored', !('http/2 200' in parsed));

    const bad = await run('security-headers', 'content-type: text/html\nserver: nginx/1.24.0\nset-cookie: a=b; Path=/\naccess-control-allow-origin: *');
    check('missing HSTS reported', bad.output.includes('Strict-Transport-Security'));
    check('missing CSP reported', bad.output.includes('Content-Security-Policy'));
    check('missing nosniff reported', bad.output.includes('X-Content-Type-Options'));
    check('insecure cookie reported', bad.output.includes('HttpOnly'));
    check('server banner reported', bad.output.toLowerCase().includes('nginx'));
    check('wildcard CORS reported', bad.output.includes('CORS'));
    check('grades low', /Grade [DEF]/.test(bad.note), bad.note);

    const good = await run('security-headers', [
      'strict-transport-security: max-age=31536000; includeSubDomains',
      "content-security-policy: default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'",
      'x-content-type-options: nosniff',
      'referrer-policy: strict-origin-when-cross-origin',
      'permissions-policy: geolocation=()',
      'set-cookie: s=1; Path=/; Secure; HttpOnly; SameSite=Lax',
    ].join('\n'));
    check('good headers grade well', /Grade [AB]/.test(good.note), good.note);

    // Basic auth
    const enc = await run('basic-auth', 'admin:hunter2');
    check('basic auth encodes', enc.output.includes('YWRtaW46aHVudGVyMg=='), enc.output);
    const dec = await run('basic-auth', 'Basic YWRtaW46aHVudGVyMg==');
    check('basic auth decodes', dec.output.includes('admin') && dec.output.includes('hunter2'), dec.output);
    let badCreds = false;
    try { await run('basic-auth', 'nocolonhere'); } catch { badCreds = true; }
    check('basic auth rejects input with no colon', badCreds);

    // Secret scanner
    const scan = await run('secret-scanner', [
      'AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE',
      'github_token: ghp_1234567890abcdefghijklmnopqrstuvwx',
      'STRIPE=sk_live_EXAMPLEONLYnotreal',
      'DATABASE_URL=postgres://admin:s3cr3tp4ss@db.example.com:5432/app',
      '-----BEGIN RSA PRIVATE KEY-----',
      'nothing = "harmless"',
    ].join('\n'));
    check('finds AWS key', scan.output.includes('AWS access key'));
    check('finds GitHub token', scan.output.includes('GitHub token'));
    check('finds Stripe key', scan.output.includes('Stripe'));
    check('finds password in URL', scan.output.includes('Password in a URL'));
    check('finds private key block', scan.output.includes('Private key'));
    check('masks the matched value', !scan.output.includes('ghp_1234567890abcdefghijklmnopqrstuvwx'), 'secret must not be echoed in full');
    check('reports criticals', /critical/.test(scan.note), scan.note);

    const clean = await run('secret-scanner', 'const greeting = "hello";\nconst count = 42;');
    check('clean text reports nothing', clean.note === 'clean', clean.note);

    const redacted = await run('secret-scanner', 'token: ghp_1234567890abcdefghijklmnopqrstuvwx', { redact: true });
    check('redact mode replaces the secret', redacted.output.includes('[REDACTED') && !redacted.output.includes('ghp_1234567890abcdefghijklmnopqrstuvwx'), redacted.output);

    // CSP
    const csp = await run('csp-builder', "default-src *; script-src 'unsafe-inline' 'unsafe-eval'");
    check('CSP flags unsafe-inline', csp.output.includes('unsafe-inline'));
    check('CSP flags unsafe-eval', csp.output.includes('unsafe-eval'));
    check('CSP flags wildcard', csp.output.toLowerCase().includes('wildcard'));
    check('CSP flags missing frame-ancestors', csp.output.includes('frame-ancestors'));

    const preset = await run('csp-builder', '', { preset: 'strict' });
    check('CSP strict preset generates a nonce', preset.output.includes('nonce-'), preset.output.slice(0, 120));
    check('CSP strict preset has no unsafe directives', !preset.output.includes('unsafe-'));
  }

} catch (err) {
  fail++;
  lines.push(`<span class="fail">FATAL ${esc(err.message)}\n${esc(err.stack)}</span>`);
}

lines.push(`\n<b>${pass} passed, ${fail} failed</b>`);
lines.push(fail === 0 ? '<span class="pass">ALL GOOD</span>' : '<span class="fail">FAILURES PRESENT</span>');
out.innerHTML = lines.join('\n');
window.__done = true;
</script>
</body>
</html>
